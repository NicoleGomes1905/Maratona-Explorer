<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maratona Explorer</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script src="scripts/app.js" defer></script>
  </head>

  <body>
    <div id="container">
      <img src="assets/crystal-ball.svg" alt="Crystal ball illustration" />
      <h1>Ask your question</h1>
      <p class="description">
        Type a question and click the button to receive a fun answer.
      </p>
      <input
        id="questionInput"
        type="text"
        placeholder="Type your question here"
      />
      <button id="askButton">Ask Question</button>
      <div id="answer"></div>
    </div>
  </body>
</html>
